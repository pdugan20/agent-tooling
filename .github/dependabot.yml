version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 14
    open-pull-requests-limit: 0
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      development-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 14
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
