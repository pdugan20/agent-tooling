name: Release Patrick Delivery

on:
  push:
    tags:
      - patrick-delivery-v*

permissions:
  contents: write

concurrency:
  group: patrick-delivery-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Patrick Delivery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.1.0
        with:
          python-version-file: .python-version

      - name: Validate release tag
        run: python scripts/validate_repository.py --release-tag "$GITHUB_REF_NAME"

      - name: Install npm dependencies
        run: npm ci

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.1

      - name: Install pinned CI binaries
        run: bash scripts/install-ci-tools.sh

      - name: Verify repository
        run: bash scripts/verify-repo.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          version=${GITHUB_REF_NAME#patrick-delivery-v}
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Patrick Delivery $version"
